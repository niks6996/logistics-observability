apiVersion: v1
kind: Namespace
metadata:
  name: logistics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-api
  namespace: logistics
spec:
  replicas: 2
  selector:
    matchLabels: {app: logistics-api}
  template:
    metadata:
      labels: {app: logistics-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: logistics-api:lab
          imagePullPolicy: IfNotPresent
          env:
            - {name: ENABLE_SIMULATION, value: "true"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: logistics-api
  namespace: logistics
  labels: {app: logistics-api}
spec:
  selector: {app: logistics-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
